<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMSH 周年紀念 - 校長室</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dialogue.css">
  <link rel="stylesheet" href="css/dialogue-options.css">
  <link rel="stylesheet" href="css/principal.css">

</head>

<body>
  <a class="return-button" href="map.html" aria-label="返回校園地圖" title="返回校園地圖"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
  <div id="game"></div>
  <div id="principalContent" class="principal-room location-page-content is-hidden">
    <header class="principal-heading">
      <h1>校長室</h1>
    </header>
    <section class="memorial-letter" aria-labelledby="memorialTitle">
      <div class="memorial-page memorial-page--left">
        <header class="memorial-letter__header">
          <div class="d-flex justify-content-between">
            <p id="memorialKicker" class="memorial-letter__kicker"></p>
            <p id="memorialMeta" class="memorial-letter__kicker"></p>
          </div>

          <h2 id="memorialTitle">正在整理紀念卡</h2>
        </header>
        <article id="memorialParagraphsLeft" class="memorial-letter__body" aria-live="polite"></article>
      </div>
      <div class="memorial-page memorial-page--right">
        <article id="memorialParagraphsRight" class="memorial-letter__body" aria-live="polite"></article>
        <figure id="artworkSection" class="memorial-artwork">
          <img id="artworkImage" alt="美術教室留下的作品">
          <figcaption id="artworkCaption"></figcaption>
        </figure>

        <p id="dateMark" class="ms-auto memorial-letter__kicker w-fit pe-4"></p>
      </div>

    </section>
    <canvas id="memoryCard" class="download-canvas" width="1080" height="1350" aria-hidden="true"></canvas>

    <footer class="memorial-letter__footer">
      <button id="generateCard" class="principal-button" type="button"><i class="fa-solid fa-rotate" aria-hidden="true"></i><span>更新紀念卡</span></button>
      <button id="downloadCard" class="principal-button principal-button--primary" type="button"><i class="fa-solid fa-download" aria-hidden="true"></i><span>下載紀念卡</span></button>
      <button id="backToMap" class="principal-button" type="button"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span>返回地圖</span></button>
    </footer>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/principal.js"></script>
  <script src="js/location-intro.js"></script>
  <script>
    startLocationIntro({
      data: 'data/intro_principal.json',
      storageKey: 'seen_intro_principal',
      contentSelector: '#principalContent',
      onReady: initPrincipal
    });
  </script>
</body>

</html>
