<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmIUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMSH 周年紀念 - 實驗室回憶碎片收集</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/lab.css">
    <link rel="stylesheet" href="../css/dialogue.css">
</head>
<body>
    <a class="map-return-button" href="../map.html" aria-label="返回校園地圖" title="返回校園地圖"><i class="fa-solid fa-map" aria-hidden="true"></i></a>
    <div id="game"></div>
    <div id="labContent" class="classroom-game location-page-content is-hidden">
        <h1 class="game-title">實驗室 - 回憶碎片收集</h1>
        <div class="game-info">
            <span id="score">分數: 0</span>
            <span id="moves">步數: 0</span>
            <span id="timer">時間: 00:00</span>
            <span id="combo">Combo: 0</span>
        </div>

        <!-- 回憶對話框 -->
        <div id="memoryPopup" class="memory-popup"></div>
        <!-- Combo 特效容器 -->
        <div id="comboContainer" class="combo-container"></div>

        <div class="card-grid" id="cardGrid">
            <!-- 翻牌卡片將由 JavaScript 動態生成 -->
        </div>
        <div class="game-controls">
            <button id="resetGame">重新開始</button>
            <button id="backToMap">返回地圖</button>
        </div>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/dialogue.js"></script>
    <script src="../js/lab.js"></script>
    <script src="../js/location-intro.js"></script>
    <script>startLocationIntro({ data: '../data/intro_lab.json', storageKey: 'seen_intro_lab', contentSelector: '#labContent', onReady: initLab });</script>
</body>
</html>
