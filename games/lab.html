<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMSH 周年紀念 - 實驗紀錄翻牌配對</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/lab.css">
    <link rel="stylesheet" href="../css/dialogue.css">
</head>
<body>
    <a class="return-button" href="../map.html" aria-label="返回校園地圖" title="返回校園地圖"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
    <div id="game"></div>
    <main id="labContent" class="lab-game location-page-content is-hidden">
        <header class="lab-header">
            <h4 class="game-title">實驗紀錄校對</h4>
            <p class="objective">翻開兩份資料小卡，找出使用物品與其對應的用途或實驗。</p>
        </header>
        <div class="game-info">
            <span id="progress">配對成功 0 / 8</span>
            <span id="moves">翻牌次數 0</span>
            <span id="timer">經過時間 00:00</span>
            <span id="combo">連續成功 0</span>
        </div>

        <p id="labLog" class="lab-log" aria-live="polite"></p>
        <div class="card-grid" id="cardGrid" aria-label="實驗資料卡"></div>
        <div class="game-controls">
            <button id="resetGame" class="btn control-btn"><i class="fa-solid fa-rotate-left me-2"></i>重新開始</button>
            <button id="backToMap" class="btn control-btn"><i class="fa-solid fa-map me-2"></i>返回地圖</button>
        </div>
    </main>
    <script src="../js/utils.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/dialogue.js"></script>
    <script src="../js/lab.js"></script>
    <script src="../js/location-intro.js"></script>
    <script>startLocationIntro({ data: '../data/intro_lab.json', storageKey: 'seen_intro_lab', contentSelector: '#labContent', onReady: initLab });</script>
</body>
</html>
