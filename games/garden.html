<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMSH 周年紀念 - 花圃急救站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/garden.css">
    <link rel="stylesheet" href="../css/dialogue.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>
  <a class="return-button" href="../map.html" aria-label="返回校園地圖" title="返回校園地圖"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
  <div class="outdoor-particles" aria-hidden="true"></div>
  <div id="game"></div>
  <main id="gardenContent" class="garden-game location-page-content is-hidden">
    <header class="garden-header">
      <h1>花圃急救站</h1>
      <div class="garden-stats" aria-live="polite">
        <div class="garden-stat"><span>時間</span><strong id="timeRemaining">60</strong></div>
        <div class="garden-stat"><span>分數</span><strong id="score">0</strong></div>
        <div class="garden-stat"><span>連擊</span><strong id="combo">0</strong></div>
        <div class="garden-stat"><span>健康</span><strong id="health" aria-label="健康值 5 / 5">♥♥♥♥♥</strong></div>
      </div>
    </header>

    <section class="garden-area" aria-label="校園花圃">
      <div id="eventGrid" class="event-grid"></div>
      <p id="roundMessage" class="round-message" aria-live="polite"></p>

      <div class="toolbelt" role="toolbar" aria-label="園藝工具">
        <button class="garden-tool is-selected" type="button" data-tool="water" aria-label="澆水" title="澆水">
          <i class="fa-solid fa-droplet" aria-hidden="true"></i>
          <span>澆水</span><kbd>1</kbd>
        </button>
        <button class="garden-tool" type="button" data-tool="sunlight" aria-label="給予陽光" title="給予陽光">
          <i class="fa-solid fa-sun" aria-hidden="true"></i>
          <span>陽光</span><kbd>2</kbd>
        </button>
        <button class="garden-tool" type="button" data-tool="fertilize" aria-label="施肥" title="施肥">
          <i class="fa-solid fa-seedling" aria-hidden="true"></i>
          <span>施肥</span><kbd>3</kbd>
        </button>
        <button class="garden-tool" type="button" data-tool="tidy" aria-label="整理花圃" title="整理花圃">
          <i class="fa-solid fa-hand-sparkles" aria-hidden="true"></i>
            <span>整理</span><kbd>4</kbd>
        </button>
      </div>

      <div id="gameIntro" class="game-intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
        <div class="intro-content">
          <h2 id="introTitle">巡園準備</h2>
          <p class="intro-note">選擇工具，處理花圃裡隨機出現的狀況。</p>
          <p class="intro-note">可按鍵盤1至4切換工具。<br>事件過期或用錯工具會扣健康；60 秒結束時仍有至少一顆心，即算通關。</p>
          <div class="intro-guide" aria-label="工具對應表">
            <div class="d-flex flex-row align-items-center gap-2 nowrap">
              <span class="tool"><i class="fa-solid fa-droplet" aria-hidden="true"></i>澆水：</span>
              <span class="quiz"><i class="fa-solid fa-plant-wilt" aria-hidden="true"></i>土太乾了</span>

            </div>
            <div class="d-flex flex-row align-items-center gap-2 nowrap">
              <span class="tool"><i class="fa-solid fa-sun" aria-hidden="true"></i>陽光：</span>
              <span class="quiz"><i class="fa-solid fa-cloud-rain" aria-hidden="true"></i>天氣不好</span>
            </div>
            <div class="d-flex flex-row align-items-center gap-2 nowrap">
              <span class="tool"><i class="fa-solid fa-seedling" aria-hidden="true"></i>施肥：</span>
              <span class="quiz"><i class="fa-solid fa-seedling" aria-hidden="true"></i>養分不夠</span>

            </div>
            <div>
              <span class="tool"><i class="fa-solid fa-hand-sparkles" aria-hidden="true"></i>整理：</span>
              <span class="quiz"><i class="fa-solid fa-seedling" aria-hidden="true"></i>雜草太多、<i class="fa-solid fa-note-sticky"></i>有張紙條</span>
            </div>
          </div>

          <button id="startGame" type="button">開始巡園</button>
        </div>
      </div>

      <div id="roundResult" class="round-result hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-copy">
          <span id="resultFlower" class="result-flower" aria-hidden="true"></span>
          <h2 id="resultTitle"></h2>
          <p id="resultSummary"></p>
        </div>
        <div class="result-actions">
          <button id="restartGame" type="button">再巡一次</button>
          <button id="backToMap" type="button">返回地圖</button>
        </div>
      </div>
    </section>

    <div id="memoryPopup" class="memory-popup" aria-live="polite"></div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/dialogue.js"></script>
  <script src="../js/outdoor-effects.js"></script>
  <script src="../js/garden.js"></script>
  <script src="../js/location-intro.js"></script>
  <script>startLocationIntro({ data: '../data/intro_garden.json', storageKey: 'seen_intro_garden', contentSelector: '#gardenContent' });</script>
</body>

</html>
