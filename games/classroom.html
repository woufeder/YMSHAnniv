<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMSH 周年紀念 - 永明知識快問快答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/classroom.css">
  <link rel="stylesheet" href="../css/dialogue.css">
</head>

<body style="margin: 0; overflow-x: hidden;">
  <a class="return-button" href="../map.html" aria-label="返回校園地圖" title="返回校園地圖"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
  <div class="quiz-background" aria-hidden="true">
    <img src="../assets/images/classroom-open.jpg" alt="" />
  </div>
  <!-- 對話系統容器 -->
  <div id="game"></div>

  <div class="quiz-container" id="quizContainer" style="display: none;">
    <div class="game-info">
      <img class="logo" src="/assets/images/ui/dialogLogo.png" alt="">
      <h4 class="game-title">永明知識快問快答</h4>
      <p id="input-name" class="ms-auto">姓名<span class="ms-2">你的名字</span></p>
    </div>
    <p class="objective">隨機抽問10題，看看你對永明的了解有多深。</p>

    <div id="quiz-card" class="quiz-card">
      <div id="question-text" class="question-text">載入中...</div>
      <div id="options-grid" class="options-grid">
        <!-- 選項按鈕將由 JavaScript 動態生成 -->
      </div>
    </div>

    <div id="feedback" class="feedback-message"></div>

    <div class="game-controls">
      <button id="resetGame" class="btn control-btn"><i class="fa-solid fa-rotate-left me-2"></i>重新挑戰</button>
      <button id="backToMap" class="btn control-btn"><i class="fa-solid fa-map me-2"></i>返回地圖</button>
      <span id="progress" class="ms-auto">進度: 0 / 0</span>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/dialogue.js"></script>
  <script src="../js/classroom.js"></script>
</body>

</html>
