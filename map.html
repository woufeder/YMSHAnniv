<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMSH 周年紀念 - 校園地圖</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/dialogue.css">
</head>

<body>
  <div id="mapIntro" class="scene-container">
    <div class="background-layer">
      <img id="bg" src="assets/images/gate.png" alt="">
    </div>
    <div class="character-layer"></div>
    <div class="dialogue-layer">
      <div class="dialogue-box">
        <div class="dialogue-header"><span id="name"></span></div>
        <div id="text" class="dialogue-text"></div>
        <div class="control-area">
          <button id="nextBtn" class="next-btn" type="button" aria-label="下一句"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div id="mapContent" class="map-container location-page-content is-hidden">
    <div class="map-header">
      <h1>校園地圖</h1>
      <hr class="my-3 text-light">
      <h6 class="mb-3 sub">遊戲進度</h6>
      <div id="progress-checklist" class="progress-checklist" aria-label="主要挑戰完成進度"></div>
    </div>
    <div class="map-area">
      <img src="assets/images/map.png" alt="校園地圖" id="campusMap">
      <div class="location-markers">
        <!-- 各地點標記將由 JavaScript 動態生成 -->
      </div>
    </div>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/map.js"></script>
  <script src="js/map-intro.js"></script>

</body>

</html>
