<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMSH 周年紀念 - 校園地圖</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/dialogue.css">
</head>

<body>
  <div id="mapIntro" class="scene-container">
    <div class="background-layer">
      <img id="bg" src="assets/images/gate.png" alt="">
    </div>
    <div class="character-layer"></div>
    <div class="dialogue-layer">
      <div class="dialogue-box">
        <div class="dialogue-header"><span id="name"></span></div>
        <div id="text" class="dialogue-text"></div>
        <div class="control-area">
          <button id="nextBtn" class="next-btn" type="button" aria-label="下一句"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div id="mapContent" class="map-container location-page-content is-hidden">
    <div class="map-header">
      <button id="achievementToggle" class="achievement-toggle" type="button" aria-expanded="false" aria-controls="achievementDrawer" title="查看隱藏成就">
        <i class="fa-solid fa-star" aria-hidden="true"></i>
        <span class="visually-hidden">查看隱藏成就</span>
      </button>

      <div id="achievementBackdrop" class="achievement-backdrop" aria-hidden="true"></div>

      <aside id="achievementDrawer" class="achievement-drawer" aria-labelledby="achievementDrawerTitle" aria-hidden="true" role="dialog" aria-modal="true" inert>
        <div class="achievement-drawer-header">
          <div>
            <h4 id="achievementDrawerTitle">隱藏成就</h4>
          </div>
          <button id="achievementClose" class="achievement-close" type="button" title="關閉成就冊">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            <span class="visually-hidden">關閉成就冊</span>
          </button>
        </div>
        <div id="progress-checklist" class="progress-checklist" aria-label="隱藏成就"></div>
      </aside>
    </div>
    <div class="map-area">
      <div id="mapWorld" class="map-world">
        <img src="assets/images/map.png" alt="校園地圖" id="campusMap" draggable="false">

        <!-- RPG 角色 -->
        <div id="playerCharacter" class="player-character" style="display: none;">
          <div id="playerSprite"></div>
          <div class="player-shadow"></div>
        </div>

        <div class="location-hotspots">
          <!-- 各建築與場地的點擊熱區將由 JavaScript 動態生成 -->
        </div>

        <div class="map-debug-overlays" aria-hidden="true"></div>
      </div>

      <!-- 只供碰撞判定使用，不需要放進可視地圖世界 -->
      <canvas id="collisionCanvas" hidden></canvas>
    </div>

    <!-- 觸控按鈕（手機用） -->
    <div id="rpgControls" class="rpg-controls" style="display: none;">
      <div id="joystickZone" class="joystick-zone" aria-label="角色移動搖桿"></div>

      <div class="controls-hint">
        <span>鍵盤：↑↓←→ 或 WASD 移動</span>
      </div>
    </div>
  </div>
  <div id="EggDialogue" class="scene-container map-easter-egg-dialogue" hidden></div>
  <div class="modal fade" id="locationConfirmModal" tabindex="-1" aria-labelledby="locationConfirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="locationConfirmTitle">
            是否進入<strong id="locationConfirmBuildName"></strong>的<strong id="locationConfirmName"></strong>？
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="confirmEnterLocation">
            是
          </button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            否
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="exitConfirmModal" tabindex="-1" aria-labelledby="exitConfirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exitConfirmTitle">是否要離開校園？</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="confirmExitCampus">
            返回首頁
          </button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            繼續逛逛
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/location-intro.js"></script>
  <script src="js/map-config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/map-intro.js"></script>
  <script src="js/map-rpg.js"></script>

</body>

</html>
