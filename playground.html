<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMSH 周年紀念 - 操場護犬隊</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dialogue.css">
  <link rel="stylesheet" href="css/dialogue-options.css">
  <link rel="stylesheet" href="css/playground.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body id="playground">
  <a class="return-button" href="map.html" aria-label="返回校園地圖" title="返回校園地圖"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
  <div class="outdoor-particles" aria-hidden="true"></div>
  <div id="game" class="playground-ending-dialogue"></div>

  <main class="playground-rescue hidden" aria-labelledby="gameTitle">
    <section class="rescue-panel">
      <header class="rescue-header">
        <div>
          <h3 id="gameTitle"></h3>
          <p id="gameFeedback" class="game-feedback" aria-live="assertive"></p>
        </div>
        <div class="game-stats">
          <div class="exit-meter" aria-label="小狗目前可抵達的危險缺口數量">
            <p>未阻擋缺口</p>
            <strong id="exitCount" aria-live="polite">35</strong>
          </div>
          <div class="fence-meter" aria-label="尚未使用的人牆隊形數量">
            <p>剩餘隊伍</p>
            <strong id="fenceCount" aria-live="polite">8</strong>
          </div>
        </div>
      </header>

      <section class="rescue-scene" aria-live="polite">
        <div id="gameBoard" class="game-board"></div>
        
      </section>
    </section>
  </main>

  <section id="gameIntroModal" class="playground-modal hidden" role="dialog" aria-modal="true" aria-labelledby="gameIntroTitle">
    <div class="playground-modal__content">
      <h2 id="gameIntroTitle">圍捕小狗大作戰</h2>
      <p id="gameIntroText"></p>
      <ul class="playground-modal__rules">
        <li>指揮人牆，調整方向後安排到任意空曠區域，再次點擊即可撤回</li>
        <li>小狗十字範圍不能站人，請注意安全，保持友善</li>
        <li>腳印為預測小狗移動路線，幫助檢查漏洞</li>
        <li>不必安排完所有隊伍，阻止小狗從外圈缺口逃跑，圍出唯一通道</li>
      </ul>
      <button id="startGame" class="rescue-button rescue-button--primary" type="button">
        <i class="fa-solid fa-person-running" aria-hidden="true"></i> 開始指揮
      </button>
    </div>
  </section>

  <script src="js/utils.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/outdoor-effects.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/playground.js"></script>
</body>
</html>
